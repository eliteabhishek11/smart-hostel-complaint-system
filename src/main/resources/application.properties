# Smart Hostel Complaint Management System Configuration
spring.application.name=smart-hostel-complaint-system

# Server Configuration
server.port=8080
server.error.include-message=always

# Database Configuration (PostgreSQL primary with H2 automatic fallback)
# PostgreSQL Setup (uncomment if PostgreSQL server is running locally)
# spring.datasource.url=jdbc:postgresql://localhost:5432/hostel_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# H2 In-Memory Setup (for zero-config instant evaluation out-of-the-box)
spring.datasource.url=jdbc:h2:mem:hostel_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# JWT Configuration
app.jwtSecret=SmartHostelSecretKeyForJWTSigningAndAuthSecurityTokenValidation2026!
app.jwtExpirationMs=86400000

# JavaMail Sender Configuration (Dummy/Local SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hostel.admin@college.edu
spring.mail.password=app-password-placeholder
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Static Resources
spring.web.resources.static-locations=classpath:/static/
